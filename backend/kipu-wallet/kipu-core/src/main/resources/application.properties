spring.application.name=wallet-core
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Pendientes de decision de Producto (sin valor por defecto; deben venir del perfil/entorno):
#   wallet.payments.max-amount-cents   regla de monto bajo
#   wallet.idempotency.window          ventana de intento para la clave de idempotencia
#   wallet.auth.token-ttl              vigencia de la sesion (provisional hasta aprobar proveedor de autenticacion)
