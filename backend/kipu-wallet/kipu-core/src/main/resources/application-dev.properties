# H2 en modo archivo; el archivo vive en ./data (ignorado por Git).
spring.datasource.url=${WALLET_DB_URL:jdbc:h2:file:./data/wallet;LOCK_TIMEOUT=10000}
spring.datasource.username=${WALLET_DB_USER:sa}
spring.datasource.password=${WALLET_DB_PASSWORD:}

# Datos sinteticos de desarrollo (no se aplican en otros perfiles).
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# VALORES PROVISIONALES DE DESARROLLO: pendientes de decision de Producto/Compliance.
wallet.payments.max-amount-cents=${WALLET_PAYMENTS_MAX_AMOUNT_CENTS:50000}
wallet.idempotency.window=${WALLET_IDEMPOTENCY_WINDOW:PT5M}
wallet.auth.token-ttl=${WALLET_AUTH_TOKEN_TTL:PT30M}
